<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            Student Management
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link" href="/register">
                Register
            </a>

            <a class="nav-link" href="/students">
                Students
            </a>

        </div>

    </div>

</nav>
<div class="container mt-4">

<div class="container mt-5">

<h2 class="text-center mb-4">Edit Student</h2>

<form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
    </div>

    <div class="mb-3">
        <label>Age</label>
        <input type="number" name="age" class="form-control" value="{{ student.age }}" required>
    </div>

    <div class="mb-3">
        <label>Course</label>
        <input type="text" name="course" class="form-control" value="{{ student.course }}" required>
    </div>

    <button type="submit" class="btn btn-success">
        Update Student
    </button>

    <a href="/students" class="btn btn-secondary">
        Cancel
    </a>

</form>

</div>
</div>
<footer class="bg-dark text-white text-center p-3 mt-5">
    Student Management System © 2026 | Developed by Hasini
</footer>

</body>
</html>
